<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facade Tile Planner — Prototype</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      background: #111318;
      color: #e9eaee;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
    }

    #sidebar {
      width: 340px;
      min-width: 340px;
      height: 100%;
      overflow-y: auto;
      padding: 20px;
      background: #191c22;
      border-right: 1px solid #2c3038;
      z-index: 10;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .subtitle {
      color: #8e96a5;
      font-size: 13px;
      margin-bottom: 22px;
    }

    .section {
      padding: 15px 0;
      border-top: 1px solid #2b2f37;
    }

    .section:first-of-type {
      border-top: 0;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: #9ca5b5;
      margin-bottom: 12px;
      letter-spacing: .04em;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 9px;
    }

    label {
      display: block;
      color: #aab1bf;
      font-size: 12px;
      margin-bottom: 5px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid #353a44;
      background: #22262e;
      color: #f1f3f6;
      border-radius: 7px;
      padding: 9px 10px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #707989;
    }

    input[type="color"] {
      padding: 3px;
      height: 38px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: .15s;
    }

    button:hover {
      background: #2d333d;
    }

    button.primary {
      background: #f1f3f6;
      color: #15171b;
      border-color: #f1f3f6;
    }

    button.primary:hover {
      background: white;
    }

    .opening {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 10px;
      margin-bottom: 8px;
      background: #20242b;
      border-radius: 8px;
      position: relative;
    }

    .opening .type {
      grid-column: 1 / -1;
    }

    .remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 25px;
      height: 25px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #8f96a3;
    }

    .remove:hover {
      color: #fff;
      background: #343943;
    }

    #viewport {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #stats {
      position: absolute;
      right: 18px;
      top: 18px;
      min-width: 220px;
      padding: 14px 16px;
      background: rgba(20, 23, 29, .88);
      border: 1px solid #343943;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .stat:last-child {
      margin-bottom: 0;
    }

    .stat span:first-child {
      color: #9ca4b2;
    }

    .stat strong {
      color: #fff;
    }

    #hint {
      position: absolute;
      bottom: 16px;
      left: 18px;
      padding: 8px 11px;
      color: #9ba2af;
      background: rgba(20, 23, 29, .75);
      border-radius: 7px;
      font-size: 12px;
      pointer-events: none;
    }

    .texture-preview {
      width: 100%;
      height: 65px;
      border-radius: 7px;
      border: 1px solid #3a3f49;
      margin-top: 8px;
      background-size: 30px 30px;
      background-image:
        linear-gradient(45deg, #777 25%, transparent 25%),
        linear-gradient(-45deg, #777 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #777 75%),
        linear-gradient(-45deg, transparent 75%, #777 75%);
      background-position: 0 0, 0 15px, 15px -15px, -15px 0;
      background-size: 30px 30px;
    }
  </style>
</head>

<body>

<div id="app">

  <aside id="sidebar">

    <h1>Facade Tile Planner</h1>
    <div class="subtitle">3D prototype • раскладка фасадной плитки</div>

    <div class="section">
      <div class="section-title">Фасад</div>

      <div class="row">
        <div>
          <label>Ширина, м</label>
          <input id="wallWidth" type="number" min="1" step="0.1" value="12">
        </div>

        <div>
          <label>Высота, м</label>
          <input id="wallHeight" type="number" min="1" step="0.1" value="6">
        </div>
      </div>

      <button id="build">Перестроить</button>
    </div>

    <div class="section">
      <div class="section-title">Плитка</div>

      <div class="row">
        <div>
          <label>Ширина, мм</label>
          <input id="tileW" type="number" min="10" value="300">
        </div>

        <div>
          <label>Высота, мм</label>
          <input id="tileH" type="number" min="10" value="600">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Шов, мм</label>
          <input id="grout" type="number" min="0" value="8">
        </div>

        <div>
          <label>Цвет шва</label>
          <input id="groutColor" type="color" value="#555555">
        </div>
      </div>

      <div>
        <label>Цвет плитки</label>
        <input id="tileColor" type="color" value="#b9aaa0">
      </div>

      <div id="texturePreview" class="texture-preview"></div>
    </div>

    <div class="section">
      <div class="section-title">Проёмы</div>

      <div id="openings"></div>

      <div class="row">
        <button id="addWindow">+ Окно</button>
        <button id="addDoor">+ Дверь</button>
      </div>
    </div>

    <div class="section">
      <button class="primary" id="reset">Сбросить</button>
    </div>

  </aside>

  <main id="viewport">
    <canvas id="canvas"></canvas>

    <div id="stats">
      <div class="stat">
        <span>Площадь фасада</span>
        <strong id="wallArea">0 м²</strong>
      </div>

      <div class="stat">
        <span>Площадь проёмов</span>
        <strong id="openingArea">0 м²</strong>
      </div>

      <div class="stat">
        <span>Площадь плитки</span>
        <strong id="tileArea">0 м²</strong>
      </div>

      <div class="stat">
        <span>Целых плиток</span>
        <strong id="tileCount">0 шт.</strong>
      </div>

      <div class="stat">
        <span>С запасом 10%</span>
        <strong id="tileCountReserve">0 шт.</strong>
      </div>
    </div>

    <div id="hint">
      ЛКМ — вращение • колесо — масштаб • ПКМ — перемещение
    </div>
  </main>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from
  'three';

import { OrbitControls } from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';


/* =========================================================
   BASIC THREE.JS SETUP
========================================================= */

const canvas = document.getElementById('canvas');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(canvas.clientWidth, canvas.clientHeight);

renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfd3d8');

const camera = new THREE.PerspectiveCamera(
  45,
  canvas.clientWidth / canvas.clientHeight,
  0.1,
  1000
);

camera.position.set(10, 7, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3, 0);


/* =========================================================
   LIGHT
========================================================= */

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x555555,
  2.2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(5, 10, 8);
sun.castShadow = true;

scene.add(sun);


/* =========================================================
   GROUPS
========================================================= */

const facadeGroup = new THREE.Group();
scene.add(facadeGroup);

const tileGroup = new THREE.Group();
facadeGroup.add(tileGroup);

const openingGroup = new THREE.Group();
facadeGroup.add(openingGroup);


/* =========================================================
   FLOOR
========================================================= */

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({
    color: '#999999',
    roughness: 1
  })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;

scene.add(floor);


/* =========================================================
   UI
========================================================= */

const $ = id => document.getElementById(id);

const wallWidth = $('wallWidth');
const wallHeight = $('wallHeight');

const tileW = $('tileW');
const tileH = $('tileH');
const grout = $('grout');

const tileColor = $('tileColor');
const groutColor = $('groutColor');

const openingsEl = $('openings');


/* =========================================================
   OPENINGS DATA
========================================================= */

let openings = [];

let nextOpeningId = 1;


/* =========================================================
   ADD OPENING
========================================================= */

function addOpening(type) {

  const opening = {
    id: nextOpeningId++,
    type,

    width: type === 'door' ? 0.9 : 1.5,
    height: type === 'door' ? 2.1 : 1.4,

    x: type === 'door' ? 6 : 3,
    y: type === 'door' ? 0 : 3
  };

  openings.push(opening);

  renderOpeningControls();
  buildFacade();
}


/* =========================================================
   OPENING CONTROLS
========================================================= */

function renderOpeningControls() {

  openingsEl.innerHTML = '';

  for (const o of openings) {

    const el = document.createElement('div');

    el.className = 'opening';

    el.innerHTML = `
      <button class="remove" data-remove="${o.id}">×</button>

      <div class="type">
        <label>${o.type === 'door' ? 'Дверь' : 'Окно'}</label>
      </div>

      <div>
        <label>Ширина, м</label>
        <input data-id="${o.id}" data-key="width"
          type="number" min="0.1" step="0.1" value="${o.width}">
      </div>

      <div>
        <label>Высота, м</label>
        <input data-id="${o.id}" data-key="height"
          type="number" min="0.1" step="0.1" value="${o.height}">
      </div>

      <div>
        <label>X от левого края</label>
        <input data-id="${o.id}" data-key="x"
          type="number" min="0" step="0.1" value="${o.x}">
      </div>

      <div>
        <label>Y от пола</label>
        <input data-id="${o.id}" data-key="y"
          type="number" min="0" step="0.1" value="${o.y}">
      </div>
    `;

    openingsEl.appendChild(el);
  }
}


/* =========================================================
   OPENING INPUT EVENTS
========================================================= */

openingsEl.addEventListener('input', e => {

  const id = Number(e.target.dataset.id);
  const key = e.target.dataset.key;

  if (!id || !key) return;

  const opening = openings.find(x => x.id === id);

  if (!opening) return;

  opening[key] = Number(e.target.value);

  buildFacade();
});


openingsEl.addEventListener('click', e => {

  const id = Number(e.target.dataset.remove);

  if (!id) return;

  openings = openings.filter(x => x.id !== id);

  renderOpeningControls();
  buildFacade();
});


/* =========================================================
   TILE MATERIAL
========================================================= */

function createTileMaterial() {

  return new THREE.MeshStandardMaterial({
    color: tileColor.value,
    roughness: 0.75,
    metalness: 0
  });
}


/* =========================================================
   OPENING TEST
========================================================= */

function tileIntersectsOpening(
  tileX,
  tileY,
  tileWidth,
  tileHeight,
  opening
) {

  const tileRight = tileX + tileWidth;
  const tileTop = tileY + tileHeight;

  const openingRight = opening.x + opening.width;
  const openingTop = opening.y + opening.height;

  return (
    tileX < openingRight &&
    tileRight > opening.x &&
    tileY < openingTop &&
    tileTop > opening.y
  );
}


/* =========================================================
   BUILD FACADE
========================================================= */

function buildFacade() {

  /* Remove old geometry */

  while (tileGroup.children.length) {
    tileGroup.remove(tileGroup.children[0]);
  }

  while (openingGroup.children.length) {
    openingGroup.remove(openingGroup.children[0]);
  }


  const W = Math.max(1, Number(wallWidth.value));
  const H = Math.max(1, Number(wallHeight.value));

  const TW = Math.max(0.01, Number(tileW.value) / 1000);
  const TH = Math.max(0.01, Number(tileH.value) / 1000);
  const G = Math.max(0, Number(grout.value) / 1000);


  /* -----------------------------------------------
     Wall backing
  ------------------------------------------------ */

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(W, H, 0.18),
    new THREE.MeshStandardMaterial({
      color: '#777777',
      roughness: 1
    })
  );

  wall.position.set(0, H / 2, 0);
  wall.castShadow = true;
  wall.receiveShadow = true;

  facadeGroup.add(wall);


  /* -----------------------------------------------
     Tiles
  ------------------------------------------------ */

  const material = createTileMaterial();

  let count = 0;
  let coveredArea = 0;


  for (let y = 0; y < H - 0.0001; y += TH) {

    for (let x = 0; x < W - 0.0001; x += TW) {

      const currentW = Math.min(TW, W - x);
      const currentH = Math.min(TH, H - y);

      if (currentW <= 0 || currentH <= 0) {
        continue;
      }


      /* Check openings */

      let blocked = false;

      for (const opening of openings) {

        if (
          tileIntersectsOpening(
            x,
            y,
            currentW,
            currentH,
            opening
          )
        ) {
          blocked = true;
          break;
        }
      }

      if (blocked) continue;


      /* ---------------------------------------------
         Tile
      --------------------------------------------- */

      const geometry = new THREE.BoxGeometry(
        Math.max(0.001, currentW - G),
        Math.max(0.001, currentH - G),
        0.08
      );

      const tile = new THREE.Mesh(
        geometry,
        material
      );

      tile.position.set(
        -W / 2 + x + currentW / 2,
        y + currentH / 2,
        0.12
      );

      tile.castShadow = true;
      tile.receiveShadow = true;

      tileGroup.add(tile);

      count++;
      coveredArea += currentW * currentH;
    }
  }


  /* -----------------------------------------------
     Openings
  ------------------------------------------------ */

  let openingArea = 0;

  for (const o of openings) {

    if (
      o.x < 0 ||
      o.y < 0 ||
      o.x + o.width > W ||
      o.y + o.height > H
    ) {
      continue;
    }

    openingArea += o.width * o.height;

    const color =
      o.type === 'door'
        ? '#252a31'
        : '#8fb7d1';


    const geometry = new THREE.BoxGeometry(
      o.width,
      o.height,
      0.12
    );

    const mesh = new THREE.Mesh(
      geometry,
      new THREE.MeshStandardMaterial({
        color,
        roughness: 0.35,
        metalness: 0.1
      })
    );

    mesh.position.set(
      -W / 2 + o.x + o.width / 2,
      o.y + o.height / 2,
      0.17
    );

    mesh.castShadow = true;

    openingGroup.add(mesh);
  }


  /* ---------------------------------------------
     Stats
  --------------------------------------------- */

  const wallAreaValue = W * H;

  const realTileArea =
    (TW + G) * (TH + G);

  /*
    This is an approximate purchase calculation.
    A production version should calculate cuts
    separately.
  */

  const estimatedTiles =
    Math.ceil(
      coveredArea / (TW * TH)
    );

  const reserve =
    Math.ceil(estimatedTiles * 1.1);


  $('wallArea').textContent =
    wallAreaValue.toFixed(2) + ' м²';

  $('openingArea').textContent =
    openingArea.toFixed(2) + ' м²';

  $('tileArea').textContent =
    coveredArea.toFixed(2) + ' м²';

  $('tileCount').textContent =
    estimatedTiles + ' шт.';

  $('tileCountReserve').textContent =
    reserve + ' шт.';


  /* ---------------------------------------------
     Center camera
  --------------------------------------------- */

  facadeGroup.position.set(0, 0, 0);

  controls.target.set(0, H / 2, 0);

  const distance =
    Math.max(W, H) * 1.35;

  camera.position.set(
    distance * 0.9,
    H * 0.75,
    distance
  );

  camera.lookAt(
    0,
    H / 2,
    0
  );

  controls.update();
}


/* =========================================================
   EVENTS
========================================================= */

$('addWindow').addEventListener(
  'click',
  () => addOpening('window')
);

$('addDoor').addEventListener(
  'click',
  () => addOpening('door')
);

$('build').addEventListener(
  'click',
  buildFacade
);

$('reset').addEventListener('click', () => {

  wallWidth.value = 12;
  wallHeight.value = 6;

  tileW.value = 300;
  tileH.value = 600;

  grout.value = 8;

  tileColor.value = '#b9aaa0';
  groutColor.value = '#555555';

  openings = [];

  renderOpeningControls();
  buildFacade();
});


[
  wallWidth,
  wallHeight,
  tileW,
  tileH,
  grout,
  tileColor,
  groutColor
].forEach(el => {

  el.addEventListener('input', () => {
    buildFacade();
  });

});


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener('resize', () => {

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
});


/* =========================================================
   RENDER LOOP
========================================================= */

function animate() {

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene, camera);
}


/* =========================================================
   INITIAL DATA
========================================================= */

openings = [
  {
    id: nextOpeningId++,
    type: 'window',
    width: 1.6,
    height: 1.4,
    x: 2.2,
    y: 3.3
  },
  {
    id: nextOpeningId++,
    type: 'window',
    width: 1.6,
    height: 1.4,
    x: 5.2,
    y: 3.3
  },
  {
    id: nextOpeningId++,
    type: 'door',
    width: 1.0,
    height: 2.2,
    x: 9.0,
    y: 0
  }
];

renderOpeningControls();
buildFacade();
animate();

</script>

</body>
</html>
